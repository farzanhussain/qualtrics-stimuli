<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff2442">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小红书 KB">
<title>{% block title %}小红书 KB{% endblock %}</title>
<link rel="manifest" href="{{ root_prefix|default('./') }}manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="{{ root_prefix|default('./') }}icon.svg">
<link rel="apple-touch-icon" href="{{ root_prefix|default('./') }}icon.svg">
<link rel="stylesheet" href="{{ static_prefix|default('./static') }}/style.css">
</head>
<body>
<header>
  <a class="brand" href="{{ home|default('./index.html') }}">小红书 KB</a>
  <span class="meta">built {{ built_at }}</span>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
